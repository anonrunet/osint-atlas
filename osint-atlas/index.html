ader class="topbar"><button class="iconbtn hamb" id="menuBtn" aria-label="Открыть меню"><i data-lucide="menu"></i></button><div class="crumb" id="crumb">Каталог <span style="padding:0 6px">/</span> Все инструменты</div><div class="top-actions"><button class="iconbtn" id="settingsBtn" title="Настройки" aria-label="Настройки"><i data-lucide="settings-2"></i></button><button class="iconbtn" id="themeBtn" title="Переключить тему" aria-label="Переключить тему"><i data-lucide="sun-moon"></i></button></div></header><section class="content" id="view"></section></main><div class="toast" id="toast" role="status"></div></div><script src="data.js"></script><script src="dorks.js"></script><script src="app.js"></script></body></html>
